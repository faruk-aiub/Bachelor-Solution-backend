name: Backend CD

on:
  push:
    branches:
      - main
  # Optional: only run this workflow if CI passed. If you combine them in one file, it's easier,
  # but keeping them separate is also fine. We will run this on push to main.

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    # wait for CI to pass before deploying (if combined). In separate files, you can use workflow_run.
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------------------------------------------
      # Option 1: Docker Build and Push to Docker Hub / GHCR
      # -------------------------------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/bachelor-solution-backend:latest

      # -------------------------------------------------------------
      # Option 2: Deploy to Server via SSH
      # -------------------------------------------------------------
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /path/to/your/project
            git pull origin main
            docker-compose pull
            docker-compose up -d --build
            # Optional: Clean up old docker images
            docker image prune -f
